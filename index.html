<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen to Murottal</title>
    <!-- Link Font Google -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        /* CSS Section */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            padding: 20px;
        }

        .hero-content {
            max-width: 800px;
            z-index: 10;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease-out;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
            opacity: 0;
            transition: all 1s ease-out 0.3s;
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: #2563eb;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
        }

        /* Active animations */
        .visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1 id="title">Listen to Murottal</h1>
            <p id="subtitle">Find peace and tranquility through the beautiful recitation of the Holy Quran.</p>
            <a href="#" class="btn" id="cta-btn">Start Listening Now</a>
        </div>
    </section>

    <script>
        // JS Section: Animasi sederhana saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');
            const btn = document.getElementById('cta-btn');

            // Trigger animasi setelah delay singkat
            setTimeout(() => {
                title.classList.add('visible');
                subtitle.classList.add('visible');
                btn.classList.add('visible');
            }, 200);

            // Interaksi klik tombol
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                alert("Audio player functionality can be added here!");
            });
        });
    </script>
</body>
</html>
